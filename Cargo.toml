[package]
name = "easl_cli"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "easl"
path = "src/main.rs"

[features]
default = ["interpreter", "web"]
interpreter = ["easl/window"]
# `easl compile --web`, with easl's web runtime embedded (easl's
# `web-runtime` feature).
web = ["easl/web-runtime"]

[dependencies]
easl = { git = "https://github.com/Ella-Hoeppner/easl", features = ["window", "video"] }
clap = { version = "4.0", features = ["derive"] }
notify = "8.2.0"

[profile.release]
# debug = true

# strip = true
# lto = true
